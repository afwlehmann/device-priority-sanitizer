name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build the installer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package-macos.sh
      - name: Verify the installer checksum
        run: (cd dist && shasum -a 256 -c *.sha256)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.pkg dist/*.sha256 --generate-notes --title "$GITHUB_REF_NAME"
